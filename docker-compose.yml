version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: texscribble-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: texscribble-backend
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - MONGODB_URI=mongodb://mongodb:27017/markdown_latex

    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: texscribble-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
